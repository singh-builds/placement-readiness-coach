<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Plan · Placement Readiness Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebar"></div>
  <div class="main-col">
    <div id="topbar"></div>

    <div class="page-content">

      <div class="row g-3">
        <div class="col-lg-8">
          <div class="panel">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h6 mb-0">Your roadmap — <span id="roleLine"></span></h2>
              <button class="btn btn-sm btn-accent" id="regenBtn"><i class="bi bi-magic"></i> Generate from gaps</button>
            </div>
            <div class="roadmap" id="roadmap"></div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="panel">
            <h2 class="h6 mb-2">Plan completion</h2>
            <div class="stat-value mb-1" id="planPct">—</div>
            <div class="progress mb-3" style="height:6px;">
              <div class="progress-bar" id="planBar" style="background:var(--accent);"></div>
            </div>
            <p class="text-muted" style="font-size:0.83rem;">Tasks are generated from your largest skill gaps. Mark each one done as you complete it — your dashboard updates automatically.</p>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const state = renderShell({
    active: "learning-plan.html",
    title: "Learning Plan",
    subhead: "A roadmap built from your diagnostic results and skill gaps."
  });

  const role = getRoleById(state.student.targetRoleId);
  document.getElementById("roleLine").textContent = role.name;

  function renderPlan() {
    const plan = state.learningPlan[role.id] || [];
    const roadmap = document.getElementById("roadmap");

    roadmap.innerHTML = plan.length ? plan.map((t, idx) => `
      <div class="roadmap-item ${t.done ? "done" : idx === plan.findIndex(x => !x.done) ? "active" : ""}">
        <div class="roadmap-dot">${t.done ? '<i class="bi bi-check" style="font-size:0.65rem;"></i>' : ""}</div>
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <div style="font-weight:600; font-size:0.92rem; ${t.done ? "text-decoration:line-through; color:var(--slate);" : ""}">${t.task}</div>
            <div class="text-muted" style="font-size:0.8rem;">${t.topic}</div>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" ${t.done ? "checked" : ""} data-id="${t.id}">
          </div>
        </div>
      </div>
    `).join("") : `<p class="text-muted">No plan yet — click "Generate from gaps" to build one from your diagnostic results.</p>`;

    document.querySelectorAll('input[type="checkbox"][data-id]').forEach(cb => {
      cb.addEventListener("change", () => {
        const task = plan.find(t => t.id === cb.dataset.id);
        task.done = cb.checked;
        saveState(state);
        renderPlan();
      });
    });

    const total = plan.length;
    const done = plan.filter(t => t.done).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    document.getElementById("planPct").textContent = `${done} / ${total}`;
    document.getElementById("planBar").style.width = pct + "%";
  }

  function generateFromGaps() {
    const diag = state.diagnostics[role.id];
    if (!diag) { alert("Take the diagnostic test first so the plan can be built from real gaps."); return; }

    const gaps = role.skills
      .map(s => ({ name: s.name, gap: s.target - (diag.byTopic[s.name] ?? 0) }))
      .filter(s => s.gap > 0)
      .sort((a, b) => b.gap - a.gap);

    const existing = state.learningPlan[role.id] || [];
    const existingTasks = new Set(existing.map(t => t.task));
    const newTasks = [];

    gaps.forEach(g => {
      (LEARNING_RESOURCES[g.name] || []).forEach(task => {
        if (!existingTasks.has(task)) {
          newTasks.push({ id: "lp_" + Math.random().toString(36).slice(2, 8), topic: g.name, task, done: false });
        }
      });
    });

    state.learningPlan[role.id] = [...existing, ...newTasks];
    saveState(state);
    renderPlan();
  }

  document.getElementById("regenBtn").addEventListener("click", generateFromGaps);
  renderPlan();
</script>
</body>
</html>
