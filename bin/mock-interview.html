<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock Interview Log · Placement Readiness Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebar"></div>
  <div class="main-col">
    <div id="topbar"></div>

    <div class="page-content">
      <div class="row g-3">
        <div class="col-lg-8">
          <h2 class="h6 mb-3">Past attempts</h2>
          <div id="logList"></div>
        </div>

        <div class="col-lg-4">
          <div class="panel">
            <h2 class="h6 mb-3">Log a new attempt</h2>
            <form id="logForm">
              <div class="mb-2">
                <label class="form-label" style="font-size:0.85rem;">Role practised for</label>
                <input type="text" class="form-control" id="fRole" required>
              </div>
              <div class="mb-2">
                <label class="form-label" style="font-size:0.85rem;">Date</label>
                <input type="date" class="form-control" id="fDate" required>
              </div>
              <div class="mb-2">
                <label class="form-label" style="font-size:0.85rem;">Self-rating (1–5)</label>
                <input type="range" min="1" max="5" value="3" class="form-range" id="fRating">
                <div class="text-muted text-center" id="fRatingLabel" style="font-size:0.8rem;">3 / 5</div>
              </div>
              <div class="mb-3">
                <label class="form-label" style="font-size:0.85rem;">Notes — what went well, what to improve</label>
                <textarea class="form-control" id="fNotes" rows="3" required></textarea>
              </div>
              <button type="submit" class="btn btn-accent w-100">Save entry</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const state = renderShell({
    active: "mock-interview.html",
    title: "Mock Interview Log",
    subhead: "Track every practice interview and what to work on next."
  });

  const role = getRoleById(state.student.targetRoleId);
  document.getElementById("fRole").value = role.name;
  document.getElementById("fDate").value = new Date().toISOString().slice(0, 10);

  document.getElementById("fRating").addEventListener("input", (e) => {
    document.getElementById("fRatingLabel").textContent = `${e.target.value} / 5`;
  });

  function starRow(rating) {
    return Array.from({ length: 5 }, (_, i) =>
      `<i class="bi ${i < rating ? "bi-star-fill" : "bi-star"}" style="color:var(--accent); font-size:0.8rem;"></i>`
    ).join("");
  }

  function renderLog() {
    const list = document.getElementById("logList");
    const sorted = [...state.interviews].sort((a, b) => b.date.localeCompare(a.date));
    list.innerHTML = sorted.length ? sorted.map(iv => `
      <div class="panel log-card mb-3">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <strong>${iv.role}</strong>
            <div class="text-muted" style="font-size:0.8rem;">${formatDate(iv.date)}</div>
          </div>
          <div>${starRow(iv.rating)}</div>
        </div>
        <p class="mb-0 mt-2" style="font-size:0.9rem;">${iv.notes}</p>
      </div>
    `).join("") : `<p class="text-muted">No attempts logged yet — add your first one.</p>`;
  }

  document.getElementById("logForm").addEventListener("submit", (e) => {
    e.preventDefault();
    state.interviews.push({
      id: "iv_" + Math.random().toString(36).slice(2, 8),
      role: document.getElementById("fRole").value,
      date: document.getElementById("fDate").value,
      rating: parseInt(document.getElementById("fRating").value, 10),
      notes: document.getElementById("fNotes").value
    });
    saveState(state);
    e.target.reset();
    document.getElementById("fRole").value = role.name;
    document.getElementById("fDate").value = new Date().toISOString().slice(0, 10);
    document.getElementById("fRatingLabel").textContent = "3 / 5";
    renderLog();
  });

  renderLog();
</script>
</body>
</html>
