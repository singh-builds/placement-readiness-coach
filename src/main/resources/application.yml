spring:
  application:
    name: placement-readiness-coach
  datasource:
    # Render's connectionString embeds credentials, which PostgreSQL JDBC does not accept in a URL.
    # Use Render's discrete connection properties instead.
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:placement_coach}
    username: ${DATABASE_USERNAME:placement_user}
    password: ${DATABASE_PASSWORD:placement_password}
    hikari:
      # A new Render Postgres instance can take a short time to accept connections.
      initialization-fail-timeout: 90000
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
springdoc:
  swagger-ui:
    path: /swagger-ui.html
server:
  port: ${PORT:8080}
app:
  jwt:
    # Override APP_JWT_SECRET outside development (minimum 32 bytes).
    secret: ${APP_JWT_SECRET:change-this-development-key-change-this-development-key}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:120}
