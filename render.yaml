services:
  - type: web
    name: placement-readiness-coach
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: placement-coach-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: placement-coach-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: placement-coach-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: placement-coach-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: placement-coach-db
          property: password
      - key: APP_JWT_SECRET
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: production
  - type: web
    name: placement-coach-ai
    runtime: docker
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
databases:
  - name: placement-coach-db
    plan: free
    region: singapore
    databaseName: placement_coach
    user: placement_user
