services:
  - type: web
    name: placement-readiness-coach
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: placement-coach-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: placement-coach-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: placement-coach-db
          property: password
      - key: APP_JWT_SECRET
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: production
  - type: web
    name: placement-coach-ai
    runtime: docker
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
databases:
  - name: placement-coach-db
    plan: free
    databaseName: placement_coach
    user: placement_user
