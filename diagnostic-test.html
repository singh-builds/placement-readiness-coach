<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostic Test · Placement Readiness Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebar"></div>
  <div class="main-col">
    <div id="topbar"></div>

    <div class="page-content">
      <div class="row justify-content-center">
        <div class="col-lg-8">

          <div id="preScreen" class="panel text-center py-5">
            <i class="bi bi-pencil-square" style="font-size:2rem; color:var(--accent);"></i>
            <h2 class="h5 mt-3">Diagnostic test — <span id="preRoleName"></span></h2>
            <p class="text-muted mx-auto" style="max-width:420px;">
              6 questions covering the core topics for this role. Your score per topic will update
              the skill-gap dashboard and learning plan automatically.
            </p>
            <button class="btn btn-accent px-4" id="startBtn">Start test</button>
          </div>

          <div id="testScreen" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="pill pill-neutral" id="progressPill">Question 1 of 6</span>
              <span class="pill pill-neutral" id="topicPill"></span>
            </div>
            <div class="progress mb-3" style="height:6px;">
              <div class="progress-bar" id="progressBar" style="width:0%; background:var(--accent);"></div>
            </div>

            <div class="panel">
              <h2 class="h6 mb-3" id="questionPrompt"></h2>
              <div id="optionList"></div>
            </div>

            <div class="d-flex justify-content-between mt-3">
              <button class="btn btn-outline-ink" id="prevBtn"><i class="bi bi-arrow-left"></i> Previous</button>
              <button class="btn btn-accent" id="nextBtn">Next <i class="bi bi-arrow-right"></i></button>
            </div>
          </div>

          <div id="resultScreen" class="d-none">
            <div class="panel text-center py-4 mb-3">
              <div class="stat-value" style="font-size:2.4rem;" id="resultScore"></div>
              <div class="text-muted">Overall diagnostic score</div>
            </div>
            <div class="panel">
              <h2 class="h6 mb-3">Score by topic</h2>
              <div id="resultBreakdown"></div>
            </div>
            <div class="d-flex gap-2 mt-3">
              <a href="skill-gap.html" class="btn btn-accent">View skill-gap dashboard</a>
              <a href="learning-plan.html" class="btn btn-outline-ink">Go to learning plan</a>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  const state = renderShell({
    active: "diagnostic-test.html",
    title: "Diagnostic Test",
    subhead: "A short assessment used to measure your current skill levels."
  });

  const role = getRoleById(state.student.targetRoleId);
  document.getElementById("preRoleName").textContent = role.name;

  let current = 0;
  const answers = new Array(DIAGNOSTIC_QUESTIONS.length).fill(null);

  document.getElementById("startBtn").addEventListener("click", () => {
    document.getElementById("preScreen").classList.add("d-none");
    document.getElementById("testScreen").classList.remove("d-none");
    renderQuestion();
  });

  function renderQuestion() {
    const q = DIAGNOSTIC_QUESTIONS[current];
    document.getElementById("progressPill").textContent = `Question ${current + 1} of ${DIAGNOSTIC_QUESTIONS.length}`;
    document.getElementById("topicPill").textContent = q.topic;
    document.getElementById("progressBar").style.width = `${((current) / DIAGNOSTIC_QUESTIONS.length) * 100}%`;
    document.getElementById("questionPrompt").textContent = q.prompt;

    const letters = ["A", "B", "C", "D"];
    document.getElementById("optionList").innerHTML = q.options.map((opt, i) => `
      <div class="option-tile ${answers[current] === i ? "picked" : ""}" data-i="${i}">
        <div class="option-letter">${letters[i]}</div>
        <div>${opt}</div>
      </div>
    `).join("");

    document.querySelectorAll(".option-tile").forEach(el => {
      el.addEventListener("click", () => {
        answers[current] = parseInt(el.dataset.i, 10);
        renderQuestion();
      });
    });

    document.getElementById("prevBtn").disabled = current === 0;
    document.getElementById("nextBtn").innerHTML = current === DIAGNOSTIC_QUESTIONS.length - 1
      ? 'Submit test <i class="bi bi-check2"></i>'
      : 'Next <i class="bi bi-arrow-right"></i>';
  }

  document.getElementById("prevBtn").addEventListener("click", () => {
    if (current > 0) { current--; renderQuestion(); }
  });

  document.getElementById("nextBtn").addEventListener("click", () => {
    if (current < DIAGNOSTIC_QUESTIONS.length - 1) {
      current++;
      renderQuestion();
    } else {
      submitTest();
    }
  });

  function submitTest() {
    const topicTotals = {};
    const topicCorrect = {};
    DIAGNOSTIC_QUESTIONS.forEach((q, i) => {
      topicTotals[q.topic] = (topicTotals[q.topic] || 0) + 1;
      if (answers[i] === q.answer) topicCorrect[q.topic] = (topicCorrect[q.topic] || 0) + 1;
    });

    const byTopic = {};
    Object.keys(topicTotals).forEach(topic => {
      byTopic[topic] = Math.round(((topicCorrect[topic] || 0) / topicTotals[topic]) * 100);
    });

    // Carry over existing scores for role skills not covered by this quiz
    const existing = state.diagnostics[role.id]?.byTopic || {};
    role.skills.forEach(s => { if (!(s.name in byTopic) && existing[s.name] != null) byTopic[s.name] = existing[s.name]; });

    const correctCount = DIAGNOSTIC_QUESTIONS.filter((q, i) => answers[i] === q.answer).length;
    const score = Math.round((correctCount / DIAGNOSTIC_QUESTIONS.length) * 100);

    state.diagnostics[role.id] = { score, byTopic, takenAt: new Date().toISOString().slice(0, 10) };
    state.analyticsHistory.push({ date: state.diagnostics[role.id].takenAt, readiness: score });
    saveState(state);

    document.getElementById("testScreen").classList.add("d-none");
    document.getElementById("resultScreen").classList.remove("d-none");
    document.getElementById("resultScore").textContent = score + "%";
    document.getElementById("resultBreakdown").innerHTML = Object.entries(byTopic).map(([topic, pct]) => `
      <div class="skill-row">
        <div class="skill-head"><span class="skill-name">${topic}</span><span class="skill-score">${pct}%</span></div>
        <div class="skill-track"><div class="skill-fill ${skillLevelClass(pct)}" style="width:${pct}%"></div></div>
      </div>
    `).join("");
  }
</script>
</body>
</html>
