<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Role Profiles · Placement Readiness Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebar"></div>
  <div class="main-col">
    <div id="topbar"></div>

    <div class="page-content">
      <p class="section-label">Pick the role you're preparing for. Your diagnostic test, skill-gap dashboard and learning plan are all built around this choice.</p>

      <div class="row g-3" id="roleGrid"></div>

      <div class="divider"></div>

      <div class="panel" id="roleDetail"></div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  const state = renderShell({
    active: "role-profiles.html",
    title: "Role Profiles",
    subhead: "Choose the job role your diagnostics and roadmap are built around."
  });

  function renderRoles() {
    const grid = document.getElementById("roleGrid");
    grid.innerHTML = ROLE_LIBRARY.map(role => `
      <div class="col-sm-6 col-lg-3">
        <div class="role-card ${role.id === state.student.targetRoleId ? "selected" : ""}">
          <div class="role-icon"><i class="bi ${role.icon}"></i></div>
          <div>
            <h3 class="h6 mb-1">${role.name}</h3>
            <p class="text-muted mb-0" style="font-size:0.85rem;">${role.summary}</p>
          </div>
          <div class="mt-auto pt-2">
            ${role.id === state.student.targetRoleId
              ? `<span class="pill pill-success"><i class="bi bi-check-circle"></i> Current target</span>`
              : `<button class="btn btn-sm btn-outline-ink w-100" data-role="${role.id}" onclick="selectRole('${role.id}')">Set as target role</button>`}
          </div>
        </div>
      </div>
    `).join("");
    renderDetail();
  }

  function renderDetail() {
    const role = getRoleById(state.student.targetRoleId);
    const detail = document.getElementById("roleDetail");
    detail.innerHTML = `
      <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
          <h2 class="h6 mb-1">${role.name} — required skill profile</h2>
          <p class="text-muted mb-0" style="font-size:0.85rem;">Target proficiency your diagnostic and learning plan aim for.</p>
        </div>
      </div>
      <div class="row">
        ${role.skills.map(s => `
          <div class="col-md-6">
            <div class="skill-row">
              <div class="skill-head">
                <span class="skill-name">${s.name}</span>
                <span class="skill-score">Target ${s.target}%</span>
              </div>
              <div class="skill-track"><div class="skill-fill high" style="width:${s.target}%"></div></div>
            </div>
          </div>
        `).join("")}
      </div>
    `;
  }

  function selectRole(roleId) {
    state.student.targetRoleId = roleId;
    saveState(state);
    renderRoles();
  }

  renderRoles();
</script>
</body>
</html>
