services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: placement_coach
      POSTGRES_USER: placement_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-placement_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placement_user -d placement_coach"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: placement_coach
      DATABASE_USERNAME: placement_user
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-placement_password}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET to a unique 32+ character value}
    depends_on:
      postgres:
        condition: service_healthy
  ai-service:
    build: ./ai-service
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres_data:
